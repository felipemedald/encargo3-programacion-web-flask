<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - Notas y Asistencia</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <div class="tarjeta">
        <h2>Formulario de Notas</h2>

        <form method="POST" action="/ejercicio1">
            <div class="campo">
                <label for="nota1">Nota 1:</label>
                <input type="number" id="nota1" name="nota1" min="10" max="70" step="any" required>
            </div>

            <div class="campo">
                <label for="nota2">Nota 2:</label>
                <input type="number" id="nota2" name="nota2" min="10" max="70" step="any" required>
            </div>

            <div class="campo">
                <label for="nota3">Nota 3:</label>
                <input type="number" id="nota3" name="nota3" min="10" max="70" step="any" required>
            </div>

            <div class="campo">
                <label for="asistencia">Asistencia (%):</label>
                <input type="number" id="asistencia" name="asistencia" min="0" max="100" step="any" required>
            </div>

            <button type="submit" class="btn-submit">Enviar</button>
        </form>

        {% if error %}
            <div class="caja-resultado">
                <p><strong>Error:</strong> {{ error }}</p>
            </div>
        {% endif %}

        {% if promedio is not none %}
            <div class="caja-resultado">
                <p><strong>Promedio:</strong> {{ promedio }}</p>
                <p><strong>Estado:</strong> {{ estado }}</p>
            </div>
        {% endif %}

        <a class="enlace-volver" href="/">← Volver al menú principal</a>
    </div>
</body>
</html>
